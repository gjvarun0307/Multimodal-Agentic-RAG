# Phase 2 baseline eval config.
#
# Loaded by eval/harness.py and passed straight through as the `overrides`
# dict to src.configuration.config_rag(overrides=...) -- the same
# config-only construction mechanism ablations use (invariant 10). Secrets
# (llm_provider / llm_model / llm_api_key / tavilly_api_key) are NEVER put
# here: config_rag() already resolves those from api_keys.json / env before
# this file's overrides are applied on top, so this file only carries
# non-secret tunables plus provenance fields for the results JSON schema
# (PROJECT_SPEC.md §7 Phase 2, "Results schema").

# --- provenance fields, copied verbatim into every results JSON ---
golden_set_version: 1
tavily_fixture_version: "v1"
backend: "byok-hosted"          # byok-hosted | vllm-xgrammar -- see PROJECT_SPEC.md §4A

# Judge is pinned to Groq and independent of the generation model
# (invariant 11). NOT a reasoning model, deliberately: openai/gpt-oss-20b
# (the original placeholder here) failed live judge calibration
# (2026-08-13) with a hard 400 output_parse_failed from Groq -- it emitted
# a chain-of-thought monologue instead of a clean tool call. Kept in sync
# with eval/judge.py's DEFAULT_JUDGE_MODEL -- update both together, never
# just one, since a judge prompt or model change invalidates comparability.
judge_model: "groq/llama-3.3-70b-versatile"
judge_version: "v1"

# Value actually served in production (src/configuration.py _get_defaults);
# recorded here so the eval override below is never silently divergent from
# what real users get.
serving_search_limit: 20

# --- config_rag(overrides=...) passthrough ---
overrides:
  # Eval-only -- production (app.py/src/api.py) never sets this, so live
  # demo behavior is unaffected. Pinned per PROJECT_SPEC.md's Phase 3
  # noise-floor procedure ("Temperature 0. Fix every available seed.") --
  # also sharply reduces run-to-run variance in query_router/rewrite_query
  # output text, which eval.tavily_cache's replay fixture is keyed on
  # (a different rewritten query each run was causing avoidable cache
  # misses on the web_search fallback path, 2026-08-15).
  temperature: 0
  # Deliberately >= 50 during eval, above the serving_search_limit above,
  # so Stage 1 (pre-rerank) recall@10/20/50 has headroom to measure --
  # post-rerank it can never exceed reranker_top_k regardless (PROJECT_SPEC.md
  # §7 Phase 2, "Set search_limit >= 50 during eval").
  search_limit: 50
  reranker_top_k: 5
  reranker_score_threshold: 0.5
  reranker_model: "BAAI/bge-reranker-v2-m3"   # CPU-viable default; ablation rows override this
  chunk_size: 1024
  overlap_size: 128
  sparse_weight: 0.7
  dense_weight: 1.0
  max_gen_retries: 2
  max_rewrites: 3
