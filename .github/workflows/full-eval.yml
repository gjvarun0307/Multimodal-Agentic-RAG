name: full-eval

# Trigger vehicle for verification attempt 5 (2026-08-21) -- attempt 4 ran
# clean end-to-end but eval.gate false-BLOCKed on recall@10 (diffed a
# full-tier run against the fast-tier baseline); fixed on main in 2adc9d0.
# See CLAUDE.md Phase 4 resume point.
#
# Full tier (PROJECT_SPEC.md §7 Phase 4): complete golden set (145 items,
# eval/golden/golden_set.jsonl) through the real byok-hosted pipeline --
# generation LLM + judge, every metric family, unlike fast-eval.yml's
# --retrieval-only (zero LLM calls). Needs LLM_API_KEY/JUDGE_API_KEY repo
# secrets that fast-eval.yml doesn't (only HF_TOKEN there).
#
# Generation LLM is nvidia_nim (LLM_API_KEY secret, meta/llama-3.1-8b-instruct
# via LLM_PROVIDERS' default_model -- src/configuration.py), matching the
# user's local api_keys.json (2026-08-18) -- moved off Groq for this side
# specifically to stop competing with the judge for the same Groq daily
# budget. The judge is architecturally exempt from this: invariant 11 pins
# it to Groq (llama-3.3-70b-versatile) independent of llm_provider, so
# JUDGE_API_KEY stays a Groq key regardless of what LLM_PROVIDER is set to.
#
# Trigger: run-full-eval label only, NOT nightly yet. Decided with the user
# 2026-08-18: Groq's free-tier 100k TPD budget has already been exhausted
# twice from just manual eval.harness runs (CLAUDE.md "Groq free-tier..."
# note). That budget is the judge's alone now (generation no longer
# contends for it), but a 145-item full run's ~283 judge calls (extrapolated
# from a real 39-item run's 76 judge calls, eval/results/
# 20260815T054051Z_fb38c61.json) can plausibly still exceed 100k TPD in a
# single run -- an unattended nightly run risks doing that automatically
# every night before there's any track record of a single full run
# succeeding in CI at all. Once that track record exists, uncomment the
# `schedule:` block below to add the nightly trigger PROJECT_SPEC.md §7
# calls for.
#
# eval/baselines/main.json is a fast/retrieval-only baseline (only
# metrics.retrieval.* populated) -- gating a full run against it still
# gives a real recall@10 diff (the only metric that blocks), but every
# other full-tier-only metric (router, structured, correction, system)
# will show "no baseline" per eval.gate's own docstring (invariant 15, no
# fabricated pass) until a full-tier baseline is added -- not in scope of
# this workflow, tracked separately.
#
# Budget: real, not a guess -- PROJECT_SPEC.md §7's "< 25 min" was
# optimistic by ~4x. A real labeled run (Actions run 32217728998,
# 2026-08-19) got through 60/145 items in 42m28s before hitting the
# original 45 min cap, extrapolating to ~103 min for the full split;
# setup (steps 1-8) adds ~2.5 min, so realistic wall clock is ~105-110
# min. timeout-minutes set to 300 for extra headroom over that estimate
# -- GitHub-hosted ubuntu-latest jobs are hard-capped at 6h (360 min)
# regardless of this setting, and this is a public repo with unlimited
# Actions minutes, so the extra headroom has no real cost.

on:
  # schedule:
  #   - cron: "0 9 * * *"  # 9am UTC nightly -- disabled, see note above
  pull_request:
    types: [labeled]

jobs:
  full-eval:
    if: github.event.label.name == 'run-full-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # invariant 12 -- Tavily replays from frozen fixtures in every
      # eval/CI run, never live. Explicit here (harness already defaults
      # to replay) as defense in depth: no TAVILY_API_KEY secret is set in
      # this workflow at all, so even a stray override of TAVILY_MODE
      # couldn't make a live call succeed.
      TAVILY_MODE: replay
      LLM_PROVIDER: nvidia_nim
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.lock

      # requirements.lock was frozen on macOS (CLAUDE.md "Repo facts"), so it
      # carries no CUDA pins -- on a Linux runner, plain `pip install torch`
      # from PyPI pulls the CUDA build (multi-GB of nvidia-* deps) even
      # though this runner has no GPU. Force the CPU wheel first so the
      # later full-lock install sees it already satisfied.
      - name: Install CPU-only torch/torchvision
        run: pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.lock

      # Covers both the embedding/reranker model weights (BAAI/bge-m3,
      # BAAI/bge-reranker-v2-m3, downloaded lazily on first use by
      # FlagEmbedding/sentence-transformers) and the HF Dataset snapshot
      # fetched below -- both land under the default hub cache dir. Same
      # cache key as fast-eval.yml so a fast-eval run earlier the same day
      # already warms this for free.
      - name: Cache Hugging Face hub cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-cache-v1

      # Corpus is deliberately not committed to this public repo
      # (artifacts/SOURCES.md -- license restrictions). CI fetches the
      # milvus.db + artifacts/parsed_md/ bundle from a private HF Dataset
      # instead (CLAUDE.md Phase 4 decision 1). HF_TOKEN must be a
      # read-only fine-grained token scoped to just that dataset repo.
      - name: Fetch eval corpus from private HF Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os, shutil
          from huggingface_hub import snapshot_download

          token = os.environ.get('HF_TOKEN')
          if not token:
              raise SystemExit(
                  'HF_TOKEN secret is not set -- cannot fetch the private eval '
                  'corpus. Forked-repo PRs do not receive secrets by default; '
                  'this is expected to fail there, not silently skip.'
              )

          path = snapshot_download(
              repo_id='gjvarun0307/arag-eval-corpus',
              repo_type='dataset',
              token=token,
          )
          shutil.copytree(f'{path}/milvus.db', 'milvus.db', dirs_exist_ok=True)
          shutil.copytree(f'{path}/parsed_md', 'artifacts/parsed_md', dirs_exist_ok=True)
          "

      # continue-on-error so the eval and gate steps below still run even
      # on a determinism failure -- eval.gate folds this outcome into the
      # combined report via --determinism-passed rather than the job dying
      # here with no gate report at all.
      - name: Chunk ID determinism (structural gate, invariant 3)
        id: determinism
        continue-on-error: true
        run: pytest tests/test_chunk_id_determinism.py -v

      # No --retrieval-only: this calls get_runtime() for real, runs full
      # generation (nvidia_nim, LLM_API_KEY), and grades with the judge
      # (Groq, JUDGE_API_KEY -- invariant 11, always Groq regardless of
      # LLM_PROVIDER above). JudgeGradingError/JudgeRateLimitError is
      # caught and skipped internally (eval/harness.py) rather than
      # crashing the run on a quota/rate limit hit -- visible as a smaller
      # n_scored (or n_rate_limited, specifically) in the results JSON, not
      # a hard failure. eval.gate reports a rate-limited judge metric
      # distinctly from a real regression (CLAUDE.md Phase 4 checklist).
      - name: Full eval (all metrics incl. judge)
        run: |
          python -m eval.harness --config configs/default.yaml --split full \
            | tee eval_full_metrics.json

      # eval/results/ has pre-existing committed historical runs (CLAUDE.md
      # Phase 4), so this run's own output isn't the only file in the dir --
      # `ls -t` picks the just-written one by mtime (checkout sets all
      # pre-existing files to an earlier, uniform mtime than a freshly
      # created one).
      # set -o pipefail is NOT bash's default in a GitHub Actions `run:`
      # step -- without it, `python -m eval.gate ... | tee ...` reports the
      # step's exit status as tee's (always 0), silently swallowing
      # eval.gate's exit 1 on BLOCK (found and fixed the hard way in
      # fast-eval.yml, 2026-08-18 -- carried over here from the start).
      - name: Eval gate (vs. eval/baselines/main.json, CLAUDE.md Phase 4 gate table)
        id: gate
        run: |
          set -o pipefail
          LATEST_RESULT=$(ls -t eval/results/*.json | grep -v '/noise_floor/' | head -1)
          echo "Gating $LATEST_RESULT"
          DETERMINISM_PASSED=${{ steps.determinism.outcome == 'success' && 'true' || 'false' }}
          python -m eval.gate --run "$LATEST_RESULT" --baseline eval/baselines/main.json \
            --determinism-passed "$DETERMINISM_PASSED" --out gate_report.json \
            | tee gate_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-eval-results
          path: |
            eval/results/*.json
            eval_full_metrics.json
            gate_report.json
            gate_comment.md
          retention-days: 30
